spring.application.name=subscription-system
server.port=8080

# Load local developer overrides if present (e.g., .env or application-local.properties)
spring.config.import=optional:file:.env[.properties],optional:file:application-local.properties

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/brightloop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:12345678}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Migrations (consistent with datasource and baseline enabled)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false