spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ==========================================
# 3. FLYWAY MIGRATION CONFIGURATION
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true

# ==========================================
# 4. JWT CONFIGURATION
# ==========================================
# Secret must be at least 256 bits (32+ chars) for HS256.
app.jwt.secret=${JWT_SECRET:brightloop-super-secret-key-for-hs256-at-least-32-chars-long}
# Token validity: 24 hours in milliseconds
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# 5. CORS CONFIGURATION
# ==========================================
# Comma-separated list of allowed frontend origins.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ==========================================
# 6. SEED USERS CONFIGURATION
# ==========================================
app.admin.email=${ADMIN_EMAIL:admin@brightloop.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}

# ==========================================
# 7. SPRINGDOC / SWAGGER UI CONFIGURATION
# ==========================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

